name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install stable debug signing key
        run: |
          base64 --decode ci/stable-debug.keystore.b64 > ci/stable-debug.keystore
          chmod 600 ci/stable-debug.keystore

      - name: Install bundled MC voice pack
        run: |
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import base64
          from pathlib import Path

          src = Path("ci/mc_voice_pack.zip.b64").read_text(encoding="utf-8")
          compact = "".join(src.split())
          compact += "=" * (-len(compact) % 4)
          data = base64.b64decode(compact, validate=False)
          Path("app/src/main/assets/mc_voice_pack.zip").write_bytes(data)
          print(f"MC voice pack: {len(data)} bytes")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: one-on-one-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
