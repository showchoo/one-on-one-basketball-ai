name: Build Android APK

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install stable debug signing key
        run: |
          base64 --decode ci/stable-debug.keystore.b64 > ci/stable-debug.keystore
          chmod 600 ci/stable-debug.keystore

      - name: Export E-BARD basketball model to ONNX
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ultralytics>=8.3,<9" onnx
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          import shutil
          from ultralytics import YOLO

          assets = Path("app/src/main/assets")
          assets.mkdir(parents=True, exist_ok=True)
          work = Path(".model-build")
          work.mkdir(exist_ok=True)

          pt = work / "BODD_yolov8n_0001.pt"
          url = (
              "https://huggingface.co/GabrieleGiudici/"
              "E-BARD-detection-models/resolve/main/BODD_yolov8n_0001.pt"
          )
          if not pt.exists():
              urlretrieve(url, pt)

          model = YOLO(str(pt))
          print("E-BARD class map:", model.names)

          def export_and_copy(imgsz, dest_name):
              exported = model.export(
                  format="onnx",
                  imgsz=imgsz,
                  opset=12,
                  simplify=False,
                  dynamic=False,
                  device="cpu",
              )
              exported_path = Path(str(exported))
              if not exported_path.exists():
                  candidates = list(work.rglob("*.onnx")) + list(Path(".").glob("**/*.onnx"))
                  if not candidates:
                      raise RuntimeError("ONNX export not found")
                  exported_path = max(candidates, key=lambda p: p.stat().st_mtime)

              dest = assets / dest_name
              shutil.copy2(exported_path, dest)
              print("Installed model:", dest, dest.stat().st_size, "bytes")

          export_and_copy(640, "basketball_yolov8n.onnx")
          PY

      - name: Export dedicated basketball YOLOv5 model to ONNX
        run: |
          python3 -m pip install "onnx>=1.12" onnxscript pandas pyyaml requests scipy torchvision tqdm psutil seaborn
          git clone --filter=blob:none --no-checkout https://github.com/ultralytics/yolov5.git .model-build/yolov5
          git -C .model-build/yolov5 fetch --depth 1 origin 3f02fdee1d8f1a6cf18a24be3438096466367d9f
          git -C .model-build/yolov5 checkout FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve

          work = Path(".model-build")
          pt = work / "yolov5s_basketball.pt"
          url = (
              "https://raw.githubusercontent.com/Stardust87/"
              "basketball-detection/b87b13510f782738f51a926d84d502d0db627f0d/"
              "models/yolov5s_basketball.pt"
          )
          urlretrieve(url, pt)
          print("Downloaded dedicated basketball model:", pt, pt.stat().st_size)
          PY
          test "$(git hash-object .model-build/yolov5s_basketball.pt)" = \
            "ec6d755d65c59cf94e7218b10a8228e666ad3eef"
          sed -i "s/torch.load(attempt_download(w), map_location='cpu')/torch.load(attempt_download(w), map_location='cpu', weights_only=False)/" \
            .model-build/yolov5/models/experimental.py
          python3 .model-build/yolov5/export.py \
            --weights .model-build/yolov5s_basketball.pt \
            --imgsz 320 320 \
            --include onnx \
            --opset 12 \
            --device cpu
          cp .model-build/yolov5s_basketball.onnx \
            app/src/main/assets/basketball_ball_yolov5s_320.onnx
          ls -lh app/src/main/assets/basketball_ball_yolov5s_320.onnx

      - name: Export TrackNetV2 basketball temporal model to ONNX
        run: |
          python3 -m pip install gdown onnx
          git clone --filter=blob:none --no-checkout https://github.com/nttcom/WASB-SBDT.git .model-build/wasb-sbdt
          git -C .model-build/wasb-sbdt fetch --depth 1 origin 923462cacdeb3353b84ddebdedb3f4b7a8553b0f
          git -C .model-build/wasb-sbdt checkout FETCH_HEAD
          gdown 1n-R_T0QyENsArYV8Qn8TneEroQkmYbT6 -O .model-build/tracknetv2_basketball_best.pth.tar
          python3 - <<'PY'
          import sys
          from pathlib import Path
          import torch
          import onnx

          root = Path(".model-build/wasb-sbdt")
          sys.path.insert(0, str(root / "src"))

          from models.unet2d import TrackNetV2

          weights = Path(".model-build/tracknetv2_basketball_best.pth.tar")
          ckpt = torch.load(weights, map_location="cpu", weights_only=False)

          model = TrackNetV2(
              n_channels=9,
              n_classes=3,
              bilinear=True,
              mode="nearest",
              halve_channel=False,
          )
          model.load_state_dict(ckpt["model_state_dict"])
          model.eval()

          class ExportWrapper(torch.nn.Module):
              def __init__(self, inner):
                  super().__init__()
                  self.inner = inner
              def forward(self, x):
                  return self.inner(x)[0]

          wrapper = ExportWrapper(model).eval()
          dummy = torch.zeros(1, 9, 288, 512, dtype=torch.float32)

          assets = Path("app/src/main/assets")
          assets.mkdir(parents=True, exist_ok=True)
          out = assets / "tracknetv2_basketball_3f.onnx"

          with torch.no_grad():
              y = wrapper(dummy)
          print("TrackNetV2 test output:", tuple(y.shape))

          torch.onnx.export(
              wrapper,
              dummy,
              out,
              input_names=["images"],
              output_names=["heatmaps"],
              opset_version=12,
              do_constant_folding=True,
          )
          m = onnx.load(out)
          onnx.checker.check_model(m)
          print("Installed temporal model:", out, out.stat().st_size, "bytes")
          PY
          ls -lh app/src/main/assets/tracknetv2_basketball_3f.onnx

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: one-on-one-ai-v0.6.6-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
