name: Build Android APK

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install stable debug signing key
        run: |
          base64 --decode ci/stable-debug.keystore.b64 > ci/stable-debug.keystore
          chmod 600 ci/stable-debug.keystore

      - name: Export E-BARD basketball model to ONNX
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ultralytics>=8.3,<9" onnx
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          import shutil
          from ultralytics import YOLO

          assets = Path("app/src/main/assets")
          assets.mkdir(parents=True, exist_ok=True)
          work = Path(".model-build")
          work.mkdir(exist_ok=True)

          pt = work / "BODD_yolov8n_0001.pt"
          url = (
              "https://huggingface.co/GabrieleGiudici/"
              "E-BARD-detection-models/resolve/main/BODD_yolov8n_0001.pt"
          )
          if not pt.exists():
              urlretrieve(url, pt)

          model = YOLO(str(pt))
          print("E-BARD class map:", model.names)

          def export_and_copy(imgsz, dest_name):
              exported = model.export(
                  format="onnx",
                  imgsz=imgsz,
                  opset=12,
                  simplify=False,
                  dynamic=False,
                  device="cpu",
              )
              exported_path = Path(str(exported))
              if not exported_path.exists():
                  candidates = list(work.rglob("*.onnx")) + list(Path(".").glob("**/*.onnx"))
                  if not candidates:
                      raise RuntimeError("ONNX export not found")
                  exported_path = max(candidates, key=lambda p: p.stat().st_mtime)

              dest = assets / dest_name
              shutil.copy2(exported_path, dest)
              print("Installed model:", dest, dest.stat().st_size, "bytes")

          export_and_copy(640, "basketball_yolov8n.onnx")
          export_and_copy(320, "basketball_yolov8n_320.onnx")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: one-on-one-ai-v0.6.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
